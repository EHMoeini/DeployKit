# Production Docker Swarm stack.
# Deploy only through Ansible (ansible/playbooks/site.yml or deploy.yml).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Stateful service: the data directory lives on the Swarm manager node.
      - /srv/${PROJECT_NAME}/postgres/data:/var/lib/postgresql/data
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        order: stop-first
        failure_action: pause

  backend:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}/backend:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${PROJECT_NAME}_postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      SHARED_STORAGE_PATH: /srv/portal/uploads
    volumes:
      # Single-node Swarm: all replicas share the host path.
      # shortcut: local bind mount, move uploads to shared storage (NFS/S3) before multi-node Swarm.
      - /srv/${PROJECT_NAME}/uploads:/srv/portal/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health/live || exit 1"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s
    networks:
      - app-internal
      - traefik-public
    deploy:
      replicas: ${BACKEND_REPLICAS:-4}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.${PROJECT_NAME}_backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/`)"
        - "traefik.http.routers.${PROJECT_NAME}_backend.priority=100"
        - "traefik.http.routers.${PROJECT_NAME}_backend.entrypoints=websecure"
        - "traefik.http.routers.${PROJECT_NAME}_backend.tls=true"
        - "traefik.http.routers.${PROJECT_NAME}_backend.tls.certresolver=letsencrypt"
        - "traefik.http.services.${PROJECT_NAME}_backend.loadbalancer.server.port=3000"

  frontend:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}/frontend:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      PORT: 8080
      API_BASE_URL: ${API_BASE_URL:-/api/v1}
      PROJECT_NAME: ${PROJECT_NAME}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health/live || exit 1"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s
    networks:
      - traefik-public
    deploy:
      replicas: ${FRONTEND_REPLICAS:-3}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.${PROJECT_NAME}_frontend.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.${PROJECT_NAME}_frontend.priority=10"
        - "traefik.http.routers.${PROJECT_NAME}_frontend.entrypoints=websecure"
        - "traefik.http.routers.${PROJECT_NAME}_frontend.tls=true"
        - "traefik.http.routers.${PROJECT_NAME}_frontend.tls.certresolver=letsencrypt"
        - "traefik.http.services.${PROJECT_NAME}_frontend.loadbalancer.server.port=8080"

networks:
  # Both networks are created by the Ansible docker role as attachable overlays.
  app-internal:
    external: true
  traefik-public:
    external: true
