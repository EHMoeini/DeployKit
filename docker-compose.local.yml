version: '3.8'

services:
  # سرویس Traefik محلی
  traefik:
    image: traefik:v3.0
    container_name: local_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080" # داشبورد محلی Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-net

  # پایگاه داده PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    environment:
      POSTGRES_DB: portal_db
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: local_secret_password
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d portal_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # کانتینر مستقل و یک‌بارمصرف اجرای Migration
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "src/config/run-migrations.js"]
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: portal_db
      DB_USER: portal_user
      DB_PASSWORD: local_secret_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  # سرویس Backend (مقیاس‌پذیر به چند Replica بدون پورت مستقیم و نام ثابت)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: portal_db
      DB_USER: portal_user
      DB_PASSWORD: local_secret_password
      JWT_SECRET: local_jwt_secret_key_1234567890_abcdef
      REFRESH_TOKEN_SECRET: local_refresh_secret_key_1234567890
      SHARED_STORAGE_PATH: /srv/portal/uploads
    volumes:
      - shared_uploads:/srv/portal/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api/`)"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

  # سرویس Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      API_BASE_URL: /api/v1
    depends_on:
      - backend
    networks:
      - app-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=10"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"

volumes:
  local_pgdata:
  shared_uploads:

networks:
  app-net:
    driver: bridge
