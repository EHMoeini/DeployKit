all:
  children:
    servers:
      hosts:
        production-server:
          # =========================================================================
          # 1. SERVER CONNECTION / مشخصات اتصال به سرور شما
          # =========================================================================
          ansible_host: 13.53.149.105 # Server IP address / آیپی سرور شما
          ansible_user: root # SSH username (root, ubuntu, ec2-user, etc.)
          ansible_port: 22 # SSH port (default: 22)
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519 # Path to your private key
          # ansible_password: "your_ssh_password" # Uncomment if using password instead of SSH key

  vars:
    # =========================================================================
    # 2. GENERAL SETTINGS / تنظیمات عمومی
    # =========================================================================
    environment_tier: production
    project_name: liquid-portal

    # Domain: If left as "{{ ansible_host }}.nip.io", it automatically configures
    # wildcard DNS and gets a FREE Let's Encrypt SSL certificate for your IP!
    # دامنه: اگر تغییر ندهید، به صورت خودکار با استفاده از آیپی و nip.io اس‌اس‌ال رایگان می‌گیرد
    domain: "{{ ansible_host }}.nip.io"
    acme_email: "admin@{{ ansible_host }}.nip.io"

    # =========================================================================
    # 3. CONTAINER IMAGES / ایمیج‌های داکر برنامه
    # =========================================================================
    # You can point directly to any Docker Hub or GHCR image:
    # می‌توانید آدرس مستقیم ایمیج‌های خود را از داکرهاب یا رجیستری‌های دیگر قرار دهید:
    backend_image: "ghcr.io/ehmoeini/deploy-with-ai-agent/backend:latest"
    frontend_image: "ghcr.io/ehmoeini/deploy-with-ai-agent/frontend:latest"

    # Registry credentials (Optional - only required if your images are private):
    # مشخصات رجیستری (اختیاری - فقط در صورتی که ایمیج‌های شما خصوصی هستند نیاز است):
    ghcr_owner: ehmoeini
    ghcr_repo: deploy-with-ai-agent
    ghcr_token: "" # your_ghcr_token_here (if private)

    # =========================================================================
    # 4. APPLICATION SECRETS / رمزهای عبور و کلیدهای امنیتی
    # =========================================================================
    db_password: strong_postgres_password_here
    jwt_secret: super_secret_jwt_access_token_signing_key_at_least_32_chars
    refresh_token_secret: super_secret_refresh_token_hmac_key_at_least_32_chars
    csrf_secret: super_secret_csrf_token_signing_salt_key
