---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all safe packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install fundamental system packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - htop
      - jq
      - ca-certificates
      - gnupg
      - lsb-release
      - tar
      - unzip
      - ufw
      - fail2ban
    state: present
