---
- name: "Update APT package cache"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: "Install base system packages"
  ansible.builtin.apt:
    name: "{{ deploykit_base_packages }}"
    state: present

- name: "Set system timezone"
  ansible.builtin.timezone:
    name: "{{ deploykit_timezone }}"

- name: "Enable and start time synchronization service (systemd-timesyncd)"
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true
