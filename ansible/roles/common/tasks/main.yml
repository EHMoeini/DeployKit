---
- name: "Include OS-family specific variables"
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: "Update APT package cache"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: "Install base system packages"
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present

- name: "Set system timezone"
  ansible.builtin.timezone:
    name: "{{ deploykit_timezone }}"

- name: "Gather service facts"
  ansible.builtin.service_facts:

- name: "Determine available time synchronization daemon"
  ansible.builtin.set_fact:
    deploykit_has_chronyd: >-
      {{ ('chronyd.service' in ansible_facts.services) and
         (ansible_facts.services['chronyd.service'].status | default('not-found') not in ['not-found', 'masked']) }}
    deploykit_has_chrony: >-
      {{ ('chrony.service' in ansible_facts.services) and
         (ansible_facts.services['chrony.service'].status | default('not-found') not in ['not-found', 'masked']) }}
    deploykit_has_timesyncd: >-
      {{ ('systemd-timesyncd.service' in ansible_facts.services) and
         (ansible_facts.services['systemd-timesyncd.service'].status | default('not-found') not in ['not-found', 'masked']) }}

- name: "Install systemd-timesyncd fallback if no time daemon exists"
  ansible.builtin.package:
    name: systemd-timesyncd
    state: present
  when:
    - not (deploykit_has_chronyd | bool)
    - not (deploykit_has_chrony | bool)
    - not (deploykit_has_timesyncd | bool)

- name: "Enable and start time synchronization service"
  ansible.builtin.systemd:
    name: "{{ 'chronyd' if (deploykit_has_chronyd | bool) else ('chrony' if (deploykit_has_chrony | bool) else 'systemd-timesyncd') }}"
    state: started
    enabled: true

- name: "Ensure chrony sources directory exists"
  ansible.builtin.file:
    path: /etc/chrony/sources.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: deploykit_has_chrony | bool

- name: "Configure fallback NTP source for chrony (UDP 123)"
  ansible.builtin.copy:
    dest: /etc/chrony/sources.d/fallback-ntp.sources
    content: |
      pool ntp.ubuntu.com iburst
    owner: root
    group: root
    mode: "0644"
  register: deploykit_chrony_fallback
  when: deploykit_has_chrony | bool

- name: "Reload chrony service"
  ansible.builtin.systemd:
    name: chrony
    state: restarted
  when:
    - deploykit_has_chrony | bool
    - deploykit_chrony_fallback.changed | default(false)
