---
# Default base packages fallback (overridden by vars/Debian.yml and vars/RedHat.yml)
deploykit_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common
  - ufw
  - unattended-upgrades
  - tzdata
  - htop
  - jq

# Default server timezone
timezone: "UTC"
deploykit_timezone: "{{ timezone | default('UTC') }}"

# Deployment user and primary group
deploy_user: "{{ custom_user | default(ansible_user | default('ubuntu')) }}"
deploy_group: "{{ custom_group | default(deploy_user) }}"
