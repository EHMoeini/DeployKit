---
- name: "Set default policy to deny incoming traffic"
  community.general.ufw:
    direction: incoming
    default: deny

- name: "Set default policy to allow outgoing traffic"
  community.general.ufw:
    direction: outgoing
    default: allow

- name: "Allow SSH traffic with rate limiting"
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port | default(22) }}"
    proto: tcp

- name: "Allow HTTP traffic for Traefik"
  community.general.ufw:
    rule: allow
    port: 80
    proto: tcp

- name: "Allow HTTPS traffic for Traefik"
  community.general.ufw:
    rule: allow
    port: 443
    proto: tcp

- name: "Enable UFW service"
  community.general.ufw:
    state: enabled
