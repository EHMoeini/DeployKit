---
- name: "Ensure Traefik data directory exists"
  ansible.builtin.file:
    path: "{{ traefik_data_dir | default('/opt/deploykit/traefik') }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Ensure acme.json exists with strict 0600 permissions"
  ansible.builtin.file:
    path: "{{ traefik_acme_file | default((traefik_data_dir | default('/opt/deploykit/traefik')) ~ '/acme.json') }}"
    state: touch
    owner: root
    group: root
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: "Ensure public Docker network exists for Traefik"
  community.docker.docker_network:
    name: "{{ traefik_network_name | default('traefik-public') }}"
    state: present

- name: "Copy Traefik docker-compose file"
  ansible.builtin.copy:
    src: ../../../traefik/docker-compose.yml
    dest: "{{ traefik_data_dir | default('/opt/deploykit/traefik') }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: "Deploy Traefik via Docker Compose"
  ansible.builtin.command:
    cmd: "docker compose -f {{ traefik_data_dir | default('/opt/deploykit/traefik') }}/docker-compose.yml up -d --remove-orphans"
  environment:
    ACME_EMAIL: "{{ traefik_acme_email }}"
    TRAEFIK_NETWORK: "{{ traefik_network_name | default('traefik-public') }}"
    TRAEFIK_ACME_FILE: "{{ traefik_acme_file | default((traefik_data_dir | default('/opt/deploykit/traefik')) ~ '/acme.json') }}"
  register: traefik_compose_up
  changed_when: "'Started' in traefik_compose_up.stdout or 'Running' in traefik_compose_up.stdout or 'Created' in traefik_compose_up.stdout"
  when: traefik_state | default('present') == 'present'

- name: "Tear down Traefik via Docker Compose when requested"
  ansible.builtin.command:
    cmd: "docker compose -f {{ traefik_data_dir | default('/opt/deploykit/traefik') }}/docker-compose.yml down"
  when: traefik_state | default('present') == 'absent'
