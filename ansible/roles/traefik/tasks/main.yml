---
- name: Create Traefik ACME directory
  ansible.builtin.file:
    path: /srv/traefik/acme
    state: directory
    owner: deployer
    group: deployer
    mode: "0755"

# A previous bind mount may have left a directory at the acme.json path.
- name: Inspect acme.json path
  ansible.builtin.stat:
    path: /srv/traefik/acme/acme.json
  register: acme_file_stat

- name: Remove stale acme.json directory left by an older deployment
  ansible.builtin.file:
    path: /srv/traefik/acme/acme.json
    state: absent
  when: acme_file_stat.stat.isdir | default(false)

- name: Create acme.json with strict 600 permissions
  ansible.builtin.file:
    path: /srv/traefik/acme/acme.json
    state: touch
    owner: deployer
    group: deployer
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Create Traefik stack directory
  ansible.builtin.file:
    path: "/srv/{{ project_name }}/traefik"
    state: directory
    owner: deployer
    group: deployer
    mode: "0755"

- name: Copy Traefik Docker Swarm stack
  ansible.builtin.copy:
    src: ../../../traefik/docker-compose.yml
    dest: "/srv/{{ project_name }}/traefik/docker-compose.yml"
    owner: deployer
    group: deployer
    mode: "0644"

- name: Deploy Traefik stack
  ansible.builtin.command:
    argv:
      - docker
      - stack
      - deploy
      - --with-registry-auth
      - --compose-file
      - "/srv/{{ project_name }}/traefik/docker-compose.yml"
      - traefik
  environment:
    ACME_EMAIL: "{{ acme_email | default('admin@' ~ domain) }}"
  register: traefik_stack_deploy
  changed_when: "'Creating' in traefik_stack_deploy.stdout or 'Updating' in traefik_stack_deploy.stdout"
  when: traefik_state | default('present') == 'present'

- name: Remove Traefik stack when requested
  ansible.builtin.command:
    argv:
      - docker
      - stack
      - rm
      - traefik
  when: traefik_state | default('present') == 'absent'
