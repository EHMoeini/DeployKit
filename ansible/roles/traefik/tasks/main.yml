---
- name: "Ensure Traefik directory exists"
  ansible.builtin.file:
    path: "{{ traefik_dir }}"
    state: directory
    owner: "{{ deploy_user | default(ansible_user) }}"
    group: "{{ deploy_user | default(ansible_user) }}"
    mode: "0755"

- name: "Ensure acme.json exists with strict 0600 permissions"
  ansible.builtin.file:
    path: "{{ traefik_dir }}/acme.json"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: "Create external Docker network for Traefik"
  community.docker.docker_network:
    name: "{{ traefik_network }}"
    state: present

- name: "Render Traefik docker-compose.yml"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_dir }}/docker-compose.yml"
    owner: "{{ deploy_user | default(ansible_user) }}"
    group: "{{ deploy_user | default(ansible_user) }}"
    mode: "0644"

- name: "Start Traefik service"
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
