---
- name: Create Traefik directory
  ansible.builtin.file:
    path: "{{ traefik_dir }}"
    state: directory
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0755"

- name: Create Traefik ACME directory
  ansible.builtin.file:
    path: "{{ traefik_acme_dir }}"
    state: directory
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0755"

- name: Inspect acme.json path
  ansible.builtin.stat:
    path: "{{ traefik_acme_file }}"
  register: acme_file_stat

- name: Remove stale acme.json directory left by older deployment
  ansible.builtin.file:
    path: "{{ traefik_acme_file }}"
    state: absent
  when: acme_file_stat.stat.isdir | default(false)

- name: Create acme.json with strict 0600 permissions
  ansible.builtin.file:
    path: "{{ traefik_acme_file }}"
    state: touch
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Check if Traefik public docker network exists
  ansible.builtin.command:
    cmd: "docker network inspect {{ traefik_network }}"
  register: traefik_net_check
  failed_when: false
  changed_when: false

- name: Create Traefik public docker network
  ansible.builtin.command:
    cmd: "docker network create {{ traefik_network }}"
  when: traefik_net_check.rc != 0

- name: Copy Traefik docker-compose file
  ansible.builtin.copy:
    src: ../../../traefik/docker-compose.yml
    dest: "{{ traefik_dir }}/docker-compose.yml"
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0644"

- name: Deploy Traefik via Docker Compose
  ansible.builtin.command:
    cmd: "docker compose -f {{ traefik_dir }}/docker-compose.yml up -d --remove-orphans"
  environment:
    ACME_EMAIL: "{{ traefik_acme_email }}"
    TRAEFIK_NETWORK: "{{ traefik_network }}"
    TRAEFIK_ACME_FILE: "{{ traefik_acme_file }}"
  register: traefik_compose_up
  changed_when: "'Started' in traefik_compose_up.stdout or 'Running' in traefik_compose_up.stdout or 'Created' in traefik_compose_up.stdout"
  when: traefik_state | default('present') == 'present'

- name: Remove Traefik via Docker Compose when requested
  ansible.builtin.command:
    cmd: "docker compose -f {{ traefik_dir }}/docker-compose.yml down"
  when: traefik_state | default('present') == 'absent'
