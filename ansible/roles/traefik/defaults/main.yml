---
traefik_user: "{{ deploy_user | default(ansible_user | default('deployer')) }}"
traefik_group: "{{ deploy_group | default(ansible_user | default('deployer')) }}"
traefik_dir: "/srv/traefik"
traefik_acme_dir: "{{ traefik_dir }}/acme"
traefik_acme_file: "{{ traefik_acme_dir }}/acme.json"
traefik_network: "traefik-public"
traefik_acme_email: "{{ acme_email | default('admin@example.com') }}"
traefik_state: "present"
