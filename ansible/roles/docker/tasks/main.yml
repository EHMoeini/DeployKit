---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_os_family == 'Debian'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: ansible_os_family == 'Debian'

- name: Add Docker repository using deb822 format
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures:
      ["{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  when: ansible_os_family == 'Debian'

- name: Install Docker Engine and Python SDK (Debian)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Install Docker Engine (RedHat / Amazon Linux)
  ansible.builtin.dnf:
    name:
      - docker
      - python3-pip
    state: present
  when: ansible_os_family == 'RedHat'

- name: Ensure Python Docker SDK is installed (RedHat / Amazon Linux)
  ansible.builtin.command:
    cmd: python3 -m pip install --upgrade docker
  register: pip_docker_install
  changed_when: "'Successfully installed' in pip_docker_install.stdout"
  when: ansible_os_family == 'RedHat'

- name: Configure Docker daemon JSON with log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "3"
        }
      }
    mode: "0644"
  notify: Restart Docker service

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Ensure deployer user belongs to docker group
  ansible.builtin.user:
    name: deployer
    groups: docker
    append: true
  failed_when: false

# Apply a pending daemon.json restart before Swarm services are deployed.
- name: Apply pending Docker daemon changes
  ansible.builtin.meta: flush_handlers

- name: Check Docker Swarm state
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - "{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}"
  register: docker_swarm_state
  changed_when: false

- name: Initialize Docker Swarm
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - init
      - --advertise-addr
      - "{{ ansible_default_ipv4.address | default(ansible_host) }}"
  when: docker_swarm_state.stdout != 'active'

# Transition from the previous Compose deployment to Swarm. Bind-mounted data
# directories are untouched; only the old containers and bridge networks go away.
- name: Remove legacy Compose containers replaced by Swarm services
  ansible.builtin.command:
    argv:
      - docker
      - rm
      - -f
      - "{{ item }}"
  loop:
    - traefik
    - "{{ project_name }}_postgres"
    - "{{ project_name }}_backend"
    - "{{ project_name }}_frontend"
    - "{{ project_name }}_migrate"
  register: legacy_container_removal
  failed_when: false
  changed_when: false

- name: Inspect existing traefik-public network driver
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - -f
      - "{% raw %}{{.Driver}}{% endraw %}"
      - traefik-public
  register: traefik_public_driver
  changed_when: false
  failed_when: false

- name: Remove legacy bridge traefik-public network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - rm
      - traefik-public
  when: traefik_public_driver.stdout | default('') == 'bridge'

- name: Inspect existing app-internal network driver
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - -f
      - "{% raw %}{{.Driver}}{% endraw %}"
      - app-internal
  register: app_internal_driver
  changed_when: false
  failed_when: false

- name: Remove legacy bridge app-internal network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - rm
      - app-internal
  when: app_internal_driver.stdout | default('') == 'bridge'

- name: Ensure application overlay network exists
  community.docker.docker_network:
    name: app-internal
    driver: overlay
    internal: true
    attachable: true
    state: present

- name: Ensure Traefik overlay network exists
  community.docker.docker_network:
    name: traefik-public
    driver: overlay
    attachable: true
    state: present
