---
- name: "Ensure APT keyrings directory exists"
  ansible.builtin.file:
    path: "{{ docker_apt_keyring_dir }}"
    state: directory
    mode: '0755'

- name: "Download official Docker GPG key for Ubuntu"
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/ubuntu/gpg"
    dest: "{{ docker_apt_keyring_path }}"
    mode: '0644'

- name: "Add official Docker APT repository for Ubuntu"
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
      signed-by={{ docker_apt_keyring_path }}]
      {{ docker_apt_repo_url }}
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: "Install official Docker Engine and Docker Compose Plugin packages"
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: "Ensure Docker service is enabled and started"
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: "Add designated users to docker group"
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
