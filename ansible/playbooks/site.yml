---
- name: "DeployKit - Ubuntu Server Provisioning"
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: "Preflight: Validate operating system distribution"
      ansible.builtin.assert:
        that:
          - ansible_distribution == deploykit_supported_os
        fail_msg: >
          [OS Incompatibility] Current operating system is '{{ ansible_distribution }}'.
          DeployKit only supports {{ deploykit_supported_os }} in this version.
        success_msg: "Operating system distribution is valid ({{ ansible_distribution }})."

    - name: "Preflight: Validate Ubuntu LTS version"
      ansible.builtin.assert:
        that:
          - ansible_distribution_version in deploykit_supported_versions
        fail_msg: >
          [Version Incompatibility] Ubuntu release '{{ ansible_distribution_version }}' is not supported.
          Supported versions: {{ deploykit_supported_versions | join(', ') }}
        success_msg: "Ubuntu version is valid ({{ ansible_distribution_version }} - {{ ansible_distribution_release }})."

  roles:
    - role: common
    - role: security
    - role: firewall
    - role: docker
    - role: traefik
