---
- name: Infrastructure Provisioning and Base Hardening
  hosts: servers
  become: true
  roles:
    - common
    - security
    - firewall
    - storage
    - docker
    - traefik
    - backup

- name: Deploy Application Services
  hosts: servers
  become: true
  vars:
    app_image_tag: "{{ image_tag | default('latest') }}"
  roles:
    - application
    - watchtower
