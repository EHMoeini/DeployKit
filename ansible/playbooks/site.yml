---
- name: "DeployKit - Server Provisioning"
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: "Preflight: Validate operating system distribution and version"
      ansible.builtin.assert:
        that:
          - >-
            (ansible_distribution == "Ubuntu" and ansible_distribution_version in ["22.04", "24.04", "26.04"]) or
            (ansible_distribution == "Debian" and ansible_distribution_major_version in ["12", "13"])
        fail_msg: >
          [OS Incompatibility] Operating system '{{ ansible_distribution }} {{ ansible_distribution_version }}' is not supported.
          DeployKit only supports Ubuntu (22.04, 24.04, 26.04) and Debian (12, 13).
        success_msg: "Operating system distribution and version are valid ({{ ansible_distribution }} {{ ansible_distribution_version }})."

  roles:
    - role: common
      tags: ["setup", "common"]
    - role: security
      tags: ["setup", "security"]
    - role: firewall
      tags: ["setup", "firewall"]
    - role: docker
      tags: ["setup", "docker"]
    - role: traefik
      tags: ["setup", "traefik"]
    - role: app
      tags: ["deploy", "app"]
